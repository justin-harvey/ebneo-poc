# Sveltia / Decap CMS config for EBNEO.
# Paths are relative to the repository root (the `site/` project).
backend:
  name: git-gateway        # Netlify Identity + Git Gateway (no GitHub login for editors)
  branch: main

# Draft -> In review -> Ready, backed by Git branches + Netlify deploy previews.
publish_mode: editorial_workflow

# Uploaded figures land in the Astro public/ tree and resolve at /img/uploads/*.
media_folder: "public/img/uploads"
public_folder: "/img/uploads"

site_url: https://ebneo.org
logo_url: /img/ebneo-logo.svg

collections:
  - name: commentaries
    label: Commentaries
    label_singular: Commentary
    description: >
      Structured critical appraisals. The hard review happens on Acta Paediatrica;
      here you publish the accepted write-up. Keep the section headings in the body.
    folder: src/content/commentaries
    create: true
    extension: md
    format: frontmatter
    slug: "{{title}}"
    identifier_field: title
    summary: "{{title}}  ·  {{publish_date}}"
    sortable_fields: [publish_date, title, investigation]
    view_filters:
      - { label: "This year", field: publish_date, pattern: "2026" }
    fields:
      - { name: title, label: Title, widget: string }
      - name: publish_date
        label: Publish date
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - name: investigation
        label: Type of investigation
        widget: select
        required: false
        options:
          - Prevention
          - Treatment
          - Therapeutics
          - Diagnosis
          - Prognosis
          - Monitoring
          - Quality improvement
          - Economics
          - Clinical prediction
          - Differential diagnosis
          - Systematic review
          - Etiology
      - { name: pmid, label: PMID, widget: string, required: false, hint: "PubMed ID — digits only" }
      - { name: doi, label: DOI, widget: string, required: false }
      - { name: reviewer_email, label: Corresponding reviewer email, widget: string, required: false }
      - name: body
        label: Commentary (structured)
        widget: markdown
        hint: "Keep the section headings. Commentary ≤ 500 words, ≤ 9 references."
        default: |
          ## Citation

          _Authors. Title. Journal. Year;Vol(Issue):pages. PMID 00000000_

          ## Reviewed By

          Name, credentials — Institution — email

          ## Type of Investigation

          ## Question

          _Framed in PICOT._

          ## Methods

          ## Main Results

          ## Conclusion

          ## Commentary

          ## References

          1.

  # Society roster — board + founders. Each file is a JSON object with a `members`
  # list, edited on the home page (src/pages/index.astro). (M2 follow-up / M3 §2.5)
  - name: society
    label: Society
    description: The Executive Board and Founders shown on the home page.
    files:
      - name: board
        label: Executive Board
        file: src/data/board.json
        format: json
        fields:
          - name: members
            label: Board members
            label_singular: Member
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: aff, label: Affiliation, widget: string }
              - { name: img, label: Photo, widget: image, required: false }
      - name: founders
        label: Founders & Past Chairs
        file: src/data/founders.json
        format: json
        fields:
          - name: members
            label: Founders
            label_singular: Founder
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: aff, label: Affiliation, widget: string }
              - { name: img, label: Photo, widget: image, required: false }

  # Monthly "Article of the Month" ballot (M4b). Authoring a new month here is the only
  # step needed to open a poll — no code change. Votes are tallied by a Netlify Function
  # (netlify/functions/vote.mjs) in Netlify Blobs, keyed by `month`. Closing a poll =
  # flip `status` to "closed"; optionally paste the final tallies to freeze them.
  - name: polls
    label: Polls (Vote)
    label_singular: Poll
    description: >
      The monthly Article of the Month ballot. Set status to "open" to accept votes;
      flip to "closed" to stop. The live site shows the newest open poll and archives the rest.
    folder: src/content/polls
    create: true
    extension: md
    format: frontmatter
    slug: "{{month}}"
    identifier_field: month
    summary: "{{month}}  ·  {{status}}"
    sortable_fields: [month, status]
    fields:
      - name: month
        label: Month
        widget: datetime
        date_format: "YYYY-MM"
        time_format: false
        picker_utc: true
        hint: "Drives the ballot key and ordering, e.g. 2026-11."
      - name: question
        label: Question
        widget: string
        default: "Which study is most likely to impact neonatal care?"
      - name: status
        label: Status
        widget: select
        default: open
        options: [open, closed]
      - name: options
        label: Candidate studies
        label_singular: Study
        widget: list
        min: 2
        max: 4
        summary: "{{fields.title}}"
        hint: "2–3 studies on the ballot. Do not reorder after votes are cast — order is the vote id."
        fields:
          - { name: title, label: Title, widget: string }
          - { name: authors, label: Authors, widget: string, required: false }
          - { name: journal, label: Journal, widget: string, required: false }
          - { name: date, label: Pub date, widget: string, required: false }
          - { name: url, label: Link, widget: string, required: false }
      - name: body
        label: Intro (optional)
        widget: markdown
        required: false
        hint: "Optional note shown above the ballot."
