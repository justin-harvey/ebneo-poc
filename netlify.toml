[build]
  # S2: materialize published commentaries from Supabase into
  # src/content/commentaries/*.md, then run the normal Astro+Pagefind build.
  # Requires SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY in the Netlify build env;
  # the materialize step fails loudly if they are missing (no stale content).
  # `npm run build` alone stays DB-free for local dev.
  command = "npm run materialize && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Secrets scanning: the Supabase anon key and project URL are PUBLIC by design and
  # are intentionally inlined into the /studio client bundle (RLS is the boundary).
  # Whitelist only those public values. SUPABASE_SERVICE_ROLE_KEY is deliberately NOT
  # listed, so the scanner keeps guarding against the real secret ever leaking.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SUPABASE_ANON_KEY,PUBLIC_SUPABASE_URL,SUPABASE_URL"

# M4b voting backend. The Function files use `export const config = { path }`, so the
# /api/vote and /api/results routes are defined in-code; this just pins the directory.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
